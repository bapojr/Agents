name: agents
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agents
      POSTGRES_DB: agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    environment:
      RESEARCH_DATABASE_URL: postgresql://agents:${POSTGRES_PASSWORD}@postgres:5432/agents
    command: ["alembic", "-c", "services/research/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  research:
    build:
      context: .
      dockerfile: services/research/Dockerfile
    env_file: .env
    environment:
      RESEARCH_DATABASE_URL: postgresql://agents:${POSTGRES_PASSWORD}@postgres:5432/agents
      RESEARCH_REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
  redis-data:
