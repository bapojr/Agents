[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pdfplumber>=0.11,<0.12",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "redis>=5,<7",
  "alembic>=1.14,<2",
  "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agents_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agents_research"]
